version: '3'
name: shop
services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: base
    container_name: shop_deviitor_app
    restart: unless-stopped
    ports:
      - "3000"
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "bun install && bun run dev"
    environment:
      - NODE_ENV=development
    env_file:
      - /root/data/shop.deviitor.com/configs/.env
    networks:
      - https_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: shop_deviitor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplerdev
      POSTGRES_PASSWORD: simplerdev_password
      POSTGRES_DB: simplerdev
    volumes:
      - /root/data/shop.deviitor.com/postgres:/var/lib/postgresql/data
    networks:
      - https_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplerdev -d simplerdev"]
      interval: 5s
      timeout: 5s
      retries: 10

  realtime:
    build:
      context: ../packages/realtime-server
      dockerfile: Dockerfile
    container_name: shop_deviitor_realtime
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - /root/data/shop.deviitor.com/configs/.env
    networks:
      - https_network

  agents:
    build:
      context: ../simplerdevelopment-agents
      dockerfile: Dockerfile
    container_name: shop_deviitor_agents
    restart: unless-stopped
    ports:
      - "4111:3000"
    env_file:
      - /root/data/shop.deviitor.com/configs/.env
    networks:
      - https_network

networks:
  https_network:
    external: true
    name: apps_https_network
